plugins { id 'com.android.application' }

android {
    namespace 'com.screentranslate.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.screentranslate.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        if (rootProject.file('.signing/password.txt').exists()) {
            sideload {
                storeFile rootProject.file('.signing/screen-translate.jks')
                storePassword rootProject.file('.signing/password.txt').text.trim()
                keyAlias 'screen-translate'
                keyPassword rootProject.file('.signing/password.txt').text.trim()
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingConfigs.findByName('sideload') != null) signingConfig signingConfigs.sideload
        }
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    implementation 'com.google.mlkit:translate:17.0.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
